<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Motion Graphics | Yashthumbcraft</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .video-section {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .video-card {
      overflow: hidden;
    }

    .video-card video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      border-radius: 18px 18px 0 0;
    }

    .video-info {
      padding: 18px 20px;
    }

    @media (max-width: 800px) {
      .video-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a class="logo" href="index.html">Yashthumbcraft</a>
    <a class="back-btn" href="index.html">← Back</a>
  </nav>

  <section class="page-header">
    <p class="eyebrow">YASH THUMBCRAFT</p>
    <h1>Motion Graphics</h1>
    <p>Creative motion graphics and engaging visual edits.</p>
  </section>

  <section class="video-section">

    <div class="video-card">
      <video controls playsinline preload="metadata">
        <source src="assets/VIDEO1.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <div class="video-info">
        <h2>Motion Graphics Edit 1</h2>
        <p>Creative Motion Design</p>
      </div>
    </div>

    <div class="video-card">
      <video controls playsinline preload="metadata">
        <source src="assets/VIDEO2.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <div class="video-info">
        <h2>Motion Graphics Edit 2</h2>
        <p>Visual Motion Design</p>
      </div>
    </div>

    <div class="video-card">
      <video controls playsinline preload="metadata">
        <source src="assets/VIDEO3.mp4" type="video/mp4">
        Your browser does not support video playback.
      </video>
      <div class="video-info">
        <h2>Motion Graphics Edit 3</h2>
        <p>Creative Visual Editing</p>
      </div>
    </div>

  </section>

  <footer>
    <p>© 2026 Yashthumbcraft. All Rights Reserved.</p>
  </footer>

</body>
</html>
